# The fixture now composes shared UI on both hosts, which means the Android host
# test loads Robolectric, an Android environment, and the Compose test runtime into
# one daemon. Gradle's default 384 MiB metaspace is not enough for that, and the
# failure is a "Failed to notify test listener > Metaspace" during the test task
# rather than anything that points at memory. These values mirror the repository
# root's, so the fixture proves the convention under the same budget real modules
# get.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
