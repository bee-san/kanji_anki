[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanji-companion-server"
version = "0.1.0"
description = "Single-user self-hosted kanji companion server that syncs from Anki via AnkiConnect."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.58,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
]

[project.scripts]
kanji-companion-server = "kanji_leech_dashboard.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["kanji_leech_dashboard*"]

[tool.setuptools.package-data]
kanji_leech_dashboard = [
  "webapp/*",
  "data/*",
  "data/**/*",
]
