name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'ankidroid/**'
      - 'core/**'
      - 'data/**'
      - 'designsystem/**'
      - 'dictionary-android/**'
      - 'dictionary-core/**'
      - 'domain/**'
      - 'fsrs/**'
      - 'fsrs-java/**'
      - 'writing-android/**'
      - 'writing-core/**'
      - 'ci/scripts/**'
      - 'ci/fixtures/ankidroid/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'ankidroid/**'
      - 'core/**'
      - 'data/**'
      - 'designsystem/**'
      - 'dictionary-android/**'
      - 'dictionary-core/**'
      - 'domain/**'
      - 'fsrs/**'
      - 'fsrs-java/**'
      - 'writing-android/**'
      - 'writing-core/**'
      - 'ci/scripts/**'
      - 'ci/fixtures/ankidroid/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-checks:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: jvm
            label: JVM tests and coverage
            tasks: ':fsrs:test :domain:test :dictionary-core:test :writing-core:test :fsrs-java:test :fsrs-java:jacocoTestReport :fsrs-java:jacocoTestCoverageVerification :core:test :core:jacocoTestReport :core:jacocoTestCoverageVerification'
            reports: |
              core/build/reports/**
              dictionary-core/build/reports/**
              domain/build/reports/**
              fsrs/build/reports/**
              fsrs-java/build/reports/**
              writing-core/build/reports/**
              core/build/test-results/**
              dictionary-core/build/test-results/**
              domain/build/test-results/**
              fsrs/build/test-results/**
              fsrs-java/build/test-results/**
              writing-core/build/test-results/**
          - id: app-unit
            label: App and Android library unit tests
            tasks: ':data:testDebugUnitTest :ankidroid:testDebugUnitTest :app:testDebugUnitTest :app:jacocoDebugUnitTestReport'
            reports: |
              app/build/reports/tests/**
              app/build/reports/jacoco/**
              app/build/test-results/**
              ankidroid/build/reports/tests/**
              ankidroid/build/test-results/**
              data/build/reports/tests/**
              data/build/test-results/**
          - id: app-static
            label: App lint and androidTest compile
            tasks: ':designsystem:compileDebugKotlin :data:compileDebugKotlin :ankidroid:compileDebugKotlin :dictionary-android:compileDebugKotlin :writing-android:compileDebugKotlin :app:compileDebugAndroidTestJavaWithJavac :app:lintDebug'
            reports: |
              app/build/reports/**
              app/build/outputs/androidTest-results/**
              data/build/reports/**
              designsystem/build/reports/**
              dictionary-android/build/reports/**
              writing-android/build/reports/**

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run deterministic fast gate
        run: ./gradlew ${{ matrix.tasks }} --parallel -Dorg.gradle.parallel=true

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-${{ matrix.id }}-diagnostics
          if-no-files-found: ignore
          path: ${{ matrix.reports }}

  asset-tests:
    name: Dictionary and asset tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run deterministic asset tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  fast-confidence-gate:
    name: Fast confidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - gradle-checks
      - asset-tests

    steps:
      - name: Confirm split checks passed
        run: true
