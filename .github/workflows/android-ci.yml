name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'fsrs-java/**'
      - 'tools/**'
      - '.github/workflows/android-ci.yml'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'core/**'
      - 'fsrs-java/**'
      - 'tools/**'
      - '.github/workflows/android-ci.yml'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-confidence-gate:
    name: Fast confidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run deterministic fast gate
        run: ./gradlew ciFast --parallel -Dorg.gradle.parallel=true

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-diagnostics
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            core/build/reports/**
            fsrs-java/build/reports/**
            app/build/test-results/**
            core/build/test-results/**
            fsrs-java/build/test-results/**
