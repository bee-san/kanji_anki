name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'bee-fsrs/**'
      - 'domain/**'
      - 'sync-domain/**'
      - 'writing-core/**'
      - 'dictionary-core/**'
      - 'update-core/**'
      - 'application/**'
      - 'automation-android/**'
      - 'backup-core/**'
      - 'branding/**'
      - 'data-api/**'
      - 'data-android/**'
      - 'data-desktop/**'
      - 'data-sql/**'
      - 'desktop-app/**'
      - 'feature-*/**'
      - 'platform-android/**'
      - 'platform-contracts/**'
      - 'platform-desktop/**'
      - 'presentation-api/**'
      - 'provider-ankiconnect/**'
      - 'provider-ankidroid/**'
      - 'reference-assets/**'
      - 'sync-api/**'
      - 'sync-engine/**'
      - 'ui-common/**'
      - 'feature-shell/**'
      - 'widget/**'
      - 'build-logic/**'
      - 'ci/scripts/**'
      - 'ci/tests/**'
      - 'ci/fixtures/ankidroid/**'
      - 'scripts/**'
      - 'tools/**'
      - '.gitattributes'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'renovate.json'
      - 'docs/dependency-updates.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'core/**'
      - 'bee-fsrs/**'
      - 'domain/**'
      - 'sync-domain/**'
      - 'writing-core/**'
      - 'dictionary-core/**'
      - 'update-core/**'
      - 'application/**'
      - 'automation-android/**'
      - 'backup-core/**'
      - 'branding/**'
      - 'data-api/**'
      - 'data-android/**'
      - 'data-desktop/**'
      - 'data-sql/**'
      - 'desktop-app/**'
      - 'feature-*/**'
      - 'platform-android/**'
      - 'platform-contracts/**'
      - 'platform-desktop/**'
      - 'presentation-api/**'
      - 'provider-ankiconnect/**'
      - 'provider-ankidroid/**'
      - 'reference-assets/**'
      - 'sync-api/**'
      - 'sync-engine/**'
      - 'ui-common/**'
      - 'feature-shell/**'
      - 'widget/**'
      - 'build-logic/**'
      - 'ci/scripts/**'
      - 'ci/tests/**'
      - 'ci/fixtures/ankidroid/**'
      - 'scripts/**'
      - 'tools/**'
      - '.gitattributes'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'renovate.json'
      - 'docs/dependency-updates.md'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-checks:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: build-logic
            label: Android convention plugin tests
            tasks: 'testBuildLogic'
            reports: |
              build-logic/build/reports/**
              build-logic/build/test-results/**
          - id: jvm
            label: JVM tests and coverage
            tasks: ':bee-fsrs:test :bee-fsrs:jacocoTestReport :bee-fsrs:jacocoTestCoverageVerification :core:test :core:jacocoTestReport :core:jacocoTestCoverageVerification :domain:test :domain:jacocoTestReport :domain:jacocoTestCoverageVerification :sync-domain:test :sync-domain:jacocoTestReport :sync-domain:jacocoTestCoverageVerification :writing-core:test :writing-core:jacocoTestReport :writing-core:jacocoTestCoverageVerification :dictionary-core:test :dictionary-core:jacocoTestReport :dictionary-core:jacocoTestCoverageVerification :update-core:test :update-core:jacocoTestReport :update-core:jacocoTestCoverageVerification'
            reports: |
              core/build/reports/**
              bee-fsrs/build/reports/**
              domain/build/reports/**
              sync-domain/build/reports/**
              writing-core/build/reports/**
              dictionary-core/build/reports/**
              update-core/build/reports/**
              core/build/test-results/**
              bee-fsrs/build/test-results/**
              domain/build/test-results/**
              sync-domain/build/test-results/**
              writing-core/build/test-results/**
              dictionary-core/build/test-results/**
              update-core/build/test-results/**
          - id: presentation-api
            label: Portable presentation contracts (Android target)
            tasks: ':presentation-api:testAndroidHostTest :presentation-api:compileAndroidDeviceTest :presentation-api:lintAnalyzeAndroidHostTest'
            reports: |
              presentation-api/build/reports/**
              presentation-api/build/test-results/**
          - id: ui-common
            label: Shared Compose UI (Android target)
            tasks: ':ui-common:testAndroidHostTest :ui-common:compileAndroidDeviceTest :ui-common:lintAnalyzeAndroidHostTest'
            reports: |
              ui-common/build/reports/**
              ui-common/build/test-results/**
          - id: feature-shell
            label: Shared product shell (Android target)
            tasks: ':feature-shell:testAndroidHostTest :feature-shell:compileAndroidDeviceTest :feature-shell:lintAnalyzeAndroidHostTest'
            reports: |
              feature-shell/build/reports/**
              feature-shell/build/test-results/**
          - id: feature-home
            label: Shared Home and onboarding (Android target)
            tasks: ':feature-home:testAndroidHostTest :feature-home:compileAndroidDeviceTest :feature-home:lintAnalyzeAndroidHostTest'
            reports: |
              feature-home/build/reports/**
              feature-home/build/test-results/**
          - id: app-unit
            label: App unit tests and coverage
            tasks: ':app:testDebugUnitTest :app:jacocoDebugUnitTestReport'
            reports: |
              app/build/reports/tests/**
              app/build/reports/jacoco/**
              app/build/test-results/**
          - id: app-lint
            label: App lint
            tasks: ':app:lintDebug'
            reports: |
              app/build/reports/**
          - id: app-androidtest-compile
            label: App androidTest compile
            tasks: ':app:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestJavaWithJavac'
            reports: |
              app/build/reports/**
              app/build/outputs/androidTest-results/**

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v4

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Android SDK packages
        uses: ./.github/actions/setup-android-sdk

      - name: Cache Robolectric android-all jars
        if: matrix.id == 'app-unit' || matrix.id == 'build-logic'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Run deterministic fast gate
        run: ./gradlew ${{ matrix.tasks }} --parallel -Dorg.gradle.parallel=true

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-ci-${{ matrix.id }}-diagnostics
          if-no-files-found: ignore
          path: ${{ matrix.reports }}

  asset-tests:
    name: Dictionary, asset, and Ralph loop tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run deterministic asset tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Run Ralph loop script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run CI script tests
        # Mirrors local ciFast's testCiScripts task so CI's Fast confidence gate
        # covers the same surface (ci/tests/test_run_ankidroid_fixture.py etc.).
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py'

  dependency-safety:
    name: Dependency safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"

      - name: Validate Gradle wrapper
        uses: "gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e"

      - name: Review dependency changes
        continue-on-error: true
        uses: "actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294"

  fast-confidence-gate:
    name: Fast confidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - gradle-checks
      - asset-tests

    steps:
      - name: Confirm split checks passed
        run: "true"
