name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'fsrs-java/**'
      - 'domain/**'
      - 'sync-domain/**'
      - 'writing-core/**'
      - 'dictionary-core/**'
      - 'update-core/**'
      - 'ci/scripts/**'
      - 'ci/fixtures/ankidroid/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'renovate.json'
      - '.github/dependabot.yml'
      - 'docs/dependency-updates.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'core/**'
      - 'fsrs-java/**'
      - 'domain/**'
      - 'sync-domain/**'
      - 'writing-core/**'
      - 'dictionary-core/**'
      - 'update-core/**'
      - 'ci/scripts/**'
      - 'ci/fixtures/ankidroid/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'renovate.json'
      - '.github/dependabot.yml'
      - 'docs/dependency-updates.md'
      - 'README.md'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-checks:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: jvm
            label: JVM tests and coverage
            tasks: ':fsrs-java:test :fsrs-java:jacocoTestReport :fsrs-java:jacocoTestCoverageVerification :core:test :core:jacocoTestReport :core:jacocoTestCoverageVerification :domain:test :domain:jacocoTestReport :domain:jacocoTestCoverageVerification :sync-domain:test :sync-domain:jacocoTestReport :sync-domain:jacocoTestCoverageVerification :writing-core:test :writing-core:jacocoTestReport :writing-core:jacocoTestCoverageVerification :dictionary-core:test :dictionary-core:jacocoTestReport :dictionary-core:jacocoTestCoverageVerification :update-core:test :update-core:jacocoTestReport :update-core:jacocoTestCoverageVerification'
            reports: |
              core/build/reports/**
              fsrs-java/build/reports/**
              domain/build/reports/**
              sync-domain/build/reports/**
              writing-core/build/reports/**
              dictionary-core/build/reports/**
              update-core/build/reports/**
              core/build/test-results/**
              fsrs-java/build/test-results/**
              domain/build/test-results/**
              sync-domain/build/test-results/**
              writing-core/build/test-results/**
              dictionary-core/build/test-results/**
              update-core/build/test-results/**
          - id: app-unit
            label: App unit tests and coverage
            tasks: ':app:testDebugUnitTest :app:jacocoDebugUnitTestReport'
            reports: |
              app/build/reports/tests/**
              app/build/reports/jacoco/**
              app/build/test-results/**
          - id: app-lint
            label: App lint
            tasks: ':app:lintDebug'
            reports: |
              app/build/reports/**
          - id: app-androidtest-compile
            label: App androidTest compile
            tasks: ':app:compileDebugAndroidTestKotlin :app:compileDebugAndroidTestJavaWithJavac'
            reports: |
              app/build/reports/**
              app/build/outputs/androidTest-results/**

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Cache Robolectric android-all jars
        if: matrix.id == 'app-unit'
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-v1

      - name: Run deterministic fast gate
        run: ./gradlew ${{ matrix.tasks }} --parallel -Dorg.gradle.parallel=true

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-${{ matrix.id }}-diagnostics
          if-no-files-found: ignore
          path: ${{ matrix.reports }}

  asset-tests:
    name: Dictionary, asset, and Ralph loop tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run deterministic asset tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Run Ralph loop script tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  dependency-safety:
    name: Dependency safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"

      - name: Validate Gradle wrapper
        uses: "gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e"

      - name: Review dependency changes
        continue-on-error: true
        uses: "actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294"

  fast-confidence-gate:
    name: Fast confidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - gradle-checks
      - asset-tests

    steps:
      - name: Confirm split checks passed
        run: "true"
