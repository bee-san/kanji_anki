name: CodeQL
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/codeql.yml'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/codeql.yml'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  schedule:
    - cron: "36 4 * * 1"

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed project areas
        id: changed-areas
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="${{ github.sha }}"
          fi

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.sha }}"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="${{ github.sha }}"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")"
          APP_CHANGED=false
          CORE_CHANGED=false
          GRADLE_CHANGED=false

          if [ -z "$CHANGED_FILES" ]; then
            GRADLE_CHANGED=false
          else
            while IFS= read -r FILE; do
              case "$FILE" in
                app/*)
                  APP_CHANGED=true
                  ;;
                core/*)
                  CORE_CHANGED=true
                  ;;
                build.gradle*|settings.gradle*|gradle/*|gradle.properties|gradle/libs.versions.toml|.github/workflows/codeql.yml)
                  GRADLE_CHANGED=true
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          echo "app=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "core=$CORE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "gradle=$GRADLE_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          gradle-version: "9.4.1"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Java sources
        run: |
          set -euo pipefail
          TASKS=""
          if [ "${{ steps.changed-areas.outputs.core }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS="$TASKS :core:compileJava"
          fi
          if [ "${{ steps.changed-areas.outputs.app }}" = "true" ]; then
            TASKS="$TASKS :app:compileDebugJavaWithJavac :app:compileDebugKotlin"
          fi
          if [ -z "$TASKS" ]; then
            TASKS=":core:compileJava"
          fi
          gradle $TASKS --parallel --rerun-tasks -Dorg.gradle.parallel=true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
