name: Main Bugfix Release Orchestration

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to pass to Android Release, for example v0.4.34'
        required: true
        type: string
      dispatch_android_release:
        description: 'Dispatch android-release.yml after validation. Leave false for checklist-only planning.'
        required: true
        default: false
        type: boolean
      dispatch_confirmation:
        description: 'Required only when dispatching: type exactly "dispatch android-release.yml".'
        required: false
        default: ''
        type: string

concurrency:
  group: main-bugfix-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate release request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      should_dispatch: ${{ steps.validate.outputs.should_dispatch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate manual release request
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_ANDROID_RELEASE: ${{ inputs.dispatch_android_release }}
          DISPATCH_CONFIRMATION: ${{ inputs.dispatch_confirmation }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo '::error::Main bugfix release orchestration must run from the main branch.'
            exit 1
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::release_tag must match vMAJOR.MINOR.PATCH, for example v0.4.34.'
            exit 1
          fi

          git fetch --tags --force origin >/dev/null 2>&1
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} already exists. Use android-release.yml directly for an existing tag."
            exit 1
          fi

          should_dispatch=false
          if [[ "${DISPATCH_ANDROID_RELEASE}" == "true" ]]; then
            if [[ "${DISPATCH_CONFIRMATION}" != 'dispatch android-release.yml' ]]; then
              echo '::error::dispatch_confirmation must be exactly: dispatch android-release.yml'
              exit 1
            fi
            should_dispatch=true
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "should_dispatch=${should_dispatch}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo '## Main bugfix release orchestration'
            echo
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Android release dispatch requested: \`${should_dispatch}\`"
            echo
            echo 'This workflow never creates tags and never publishes release assets itself.'
            if [[ "${should_dispatch}" != "true" ]]; then
              echo
              echo 'Checklist-only mode: no downstream workflow was dispatched.'
              echo 'Re-run this workflow with dispatch_android_release=true and the confirmation phrase to start Android Release deliberately.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  dispatch-android-release:
    name: Dispatch Android Release
    needs: plan
    if: needs.plan.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    environment: android-release-approval
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch android-release.yml deliberately
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run android-release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "release_tag=${RELEASE_TAG}"

          {
            echo '## Android Release dispatched'
            echo
            echo "Dispatched \`android-release.yml\` on \`main\` with \`release_tag=${RELEASE_TAG}\`."
            echo 'The Android Release workflow owns validation, signing, and publishing.'
          } >> "${GITHUB_STEP_SUMMARY}"
