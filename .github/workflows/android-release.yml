name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.4.34'
        required: true
        type: string

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
      checksum_name: ${{ steps.meta.outputs.checksum_name }}
      ankidroid_fixture_required: ${{ steps.meta.outputs.ankidroid_fixture_required }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${RELEASE_TAG_INPUT}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${release_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo '::error::Release tag must match vMAJOR.MINOR.PATCH.'
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_name="${major}.${minor}.${patch}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          apk_name="kani-android-${version_name}.apk"
          checksum_name="${apk_name}.sha256"
          previous_tag="$(python3 - "${release_tag}" <<'PY'
          import re
          import subprocess
          import sys

          current = sys.argv[1]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", current)
          if not match:
              raise SystemExit(0)
          current_version = tuple(int(part) for part in match.groups())

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"],
              text=True,
          ).splitlines()
          previous = []
          for tag in tags:
              tag_match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
              if not tag_match:
                  continue
              version = tuple(int(part) for part in tag_match.groups())
              if version < current_version:
                  previous.append((version, tag))
          if previous:
              print(max(previous)[1])
          PY
          )"
          if [[ -n "${previous_tag}" ]]; then
            changed_files="$(git diff --name-only "${previous_tag}" "${GITHUB_SHA}")"
          else
            changed_files="$(git ls-tree -r --name-only "${GITHUB_SHA}")"
          fi

          ankidroid_fixture_required=false
          if [[ -z "${previous_tag}" ]]; then
            ankidroid_fixture_required=true
          else
            while IFS= read -r changed_file; do
              case "${changed_file}" in
                app/src/main/AndroidManifest.xml|\
                app/src/main/java/dev/bee/kanjianki/NoteTypeFieldMappings.java|\
                app/src/main/java/dev/bee/kanjianki/anki/*|\
                app/src/main/java/dev/bee/kanjianki/sync/*|\
                app/src/main/java/dev/bee/kanjianki/data/LocalStore*|\
                app/src/androidTest/AndroidManifest.xml|\
                app/src/androidTest/java/dev/bee/kanjianki/MainActivityInstrumentedTest.java|\
                app/src/androidTest/java/dev/bee/kanjianki/anki/*|\
                ci/fixtures/ankidroid/*|\
                ci/scripts/create_ankidroid_kiku_fixture.py|\
                ci/scripts/run_ankidroid_fixture.sh|\
                .github/workflows/android-instrumented.yml)
                  ankidroid_fixture_required=true
                  break
                  ;;
              esac
            done <<< "${changed_files}"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "apk_name=${apk_name}"
            echo "checksum_name=${checksum_name}"
            echo "ankidroid_fixture_required=${ankidroid_fixture_required}"
          } >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate and assemble release
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Decode signing keystore
        id: signing
        env:
          KANJI_ANKI_SIGNING_KEYSTORE_BASE64: ${{ secrets.KANJI_ANKI_SIGNING_KEYSTORE_BASE64 }}
        run: |
          : "${KANJI_ANKI_SIGNING_KEYSTORE_BASE64:?Missing KANJI_ANKI_SIGNING_KEYSTORE_BASE64 secret}"
          keystore_path="${RUNNER_TEMP}/kani-release.jks"
          printf '%s' "${KANJI_ANKI_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "keystore_path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Run release gate and build signed APK
        env:
          KANI_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          KANI_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
          KANI_SIGNING_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          KANI_SIGNING_STORE_PASSWORD: ${{ secrets.KANJI_ANKI_SIGNING_STORE_PASSWORD }}
          KANI_SIGNING_KEY_ALIAS: ${{ secrets.KANJI_ANKI_SIGNING_KEY_ALIAS }}
          KANI_SIGNING_KEY_PASSWORD: ${{ secrets.KANJI_ANKI_SIGNING_KEY_PASSWORD }}
        run: ./gradlew ciRelease --parallel -Dorg.gradle.parallel=true

      - name: Verify release APK metadata and signature
        run: |
          set -euo pipefail
          source_apk='app/build/outputs/apk/release/app-release.apk'
          if [[ ! -f "${source_apk}" ]]; then
            echo "::error::Expected release APK at ${source_apk}"
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "${source_apk}"
          badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${source_apk}")"
          grep -F "package: name='dev.bee.kanjianki'" <<< "${badging}"
          grep -F "versionCode='${{ needs.metadata.outputs.version_code }}'" <<< "${badging}"
          grep -F "versionName='${{ needs.metadata.outputs.version_name }}'" <<< "${badging}"

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          source_apk='app/build/outputs/apk/release/app-release.apk'
          apk_name='${{ needs.metadata.outputs.apk_name }}'
          checksum_name='${{ needs.metadata.outputs.checksum_name }}'
          apk_path="${RUNNER_TEMP}/${apk_name}"
          sha_path="${RUNNER_TEMP}/${checksum_name}"
          cp "${source_apk}" "${apk_path}"
          (cd "${RUNNER_TEMP}" && sha256sum "${apk_name}") > "${sha_path}"

          {
            echo "apk_path=${apk_path}"
            echo "sha_path=${sha_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kani-android-release-${{ needs.metadata.outputs.version_name }}
          path: |
            ${{ steps.assets.outputs.apk_path }}
            ${{ steps.assets.outputs.sha_path }}

  quality-status:
    name: Require green commit checks
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      checks: read
      contents: read
    timeout-minutes: 60

    steps:
      - name: Wait for Android CI, SonarQube, and CodeQL success
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: Fast confidence gate|Build coverage and analyze|Analyze Java/Kotlin
        run: |
          set -euo pipefail
          checks_json="${RUNNER_TEMP}/check-runs.json"
          deadline=$((SECONDS + 55 * 60))

          while true; do
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" > "${checks_json}"
            result="$(python3 - "${checks_json}" <<'PY'
          import json
          import os
          import sys

          required = os.environ["REQUIRED_CHECKS"].split("|")
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          runs = payload.get("check_runs", [])
          by_name = {}
          for run in runs:
              by_name.setdefault(run.get("name"), []).append(run)

          pending = []
          skipped = []
          failures = []
          for name in required:
              candidates = by_name.get(name, [])
              if not candidates:
                  skipped.append(name)
                  continue
              latest = sorted(
                  candidates,
                  key=lambda item: item.get("completed_at") or item.get("started_at") or "",
                  reverse=True,
              )[0]
              conclusion = latest.get("conclusion")
              status = latest.get("status")
              if status != "completed":
                  pending.append(f"{name}: status={status} conclusion={conclusion}")
              elif conclusion == "success":
                  continue
              else:
                  failures.append(f"{name}: status={status} conclusion={conclusion}")

          if failures:
              print("failure")
              for failure in failures:
                  print(failure)
          elif pending:
              print("pending")
              for item in pending:
                  print(item)
          else:
              print("success")
              for name in skipped:
                  print(f"{name}: skipped or not required by path filters")
          PY
            )"

            state="$(head -n 1 <<< "${result}")"
            details="$(tail -n +2 <<< "${result}" || true)"
            case "${state}" in
              success)
                echo "Required commit checks are green."
                break
                ;;
              failure)
                echo "Required commit checks failed:"
                printf '%s\n' "${details}"
                exit 1
                ;;
              pending)
                if (( SECONDS >= deadline )); then
                  echo "Timed out waiting for required commit checks:"
                  printf '%s\n' "${details}"
                  exit 1
                fi
                echo "Waiting for required commit checks:"
                printf '%s\n' "${details}"
                sleep 30
                ;;
              *)
                echo "Unexpected check state: ${state}"
                printf '%s\n' "${result}"
                exit 1
                ;;
            esac
          done

  ankidroid-fixture:
    name: Verify AnkiDroid provider fixture
    needs: metadata
    if: needs.metadata.outputs.ankidroid_fixture_required == 'true'
    uses: ./.github/workflows/android-instrumented.yml

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.validate.result == 'success' &&
        needs.quality-status.result == 'success' &&
        (needs.ankidroid-fixture.result == 'success' || needs.ankidroid-fixture.result == 'skipped')
      }}
    permissions:
      contents: write
    needs:
      - metadata
      - validate
      - quality-status
      - ankidroid-fixture

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: kani-android-release-${{ needs.metadata.outputs.version_name }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag='${{ needs.metadata.outputs.release_tag }}'
          apk_path="${RUNNER_TEMP}/release-assets/${{ needs.metadata.outputs.apk_name }}"
          sha_path="${RUNNER_TEMP}/release-assets/${{ needs.metadata.outputs.checksum_name }}"

          if [[ ! -f "${apk_path}" || ! -f "${sha_path}" ]]; then
            echo '::error::Downloaded release assets are missing.'
            exit 1
          fi

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${apk_path}" "${sha_path}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${release_tag}" "${apk_path}" "${sha_path}" \
              --title "${release_tag}" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"
          fi
