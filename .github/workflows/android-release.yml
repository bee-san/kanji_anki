name: Android Release

# Release philosophy: the deterministic test surface for a main-push release is
# the Android CI run that triggered this workflow (workflow_run fires only on
# success). The release itself just tags, builds the signed APK, verifies it,
# and publishes. No cross-workflow check polling, no emulator jobs: SonarQube
# and CodeQL are advisory scans on main, and the live AnkiDroid provider
# fixture runs nightly plus on demand in android-instrumented.yml. The stricter
# local real-collection AnkiDroid gate (see AGENTS.md) remains the release
# requirement for provider/sync changes.

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.4.34'
        required: true
        type: string
      allow_asset_overwrite:
        description: 'Overwrite existing release assets. Defaults to false so accidental reruns fail closed.'
        required: false
        default: false
        type: boolean

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event_name == 'workflow_run' && 'main-auto' || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      build_sha: ${{ steps.meta.outputs.build_sha }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
      checksum_name: ${{ steps.meta.outputs.checksum_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            build_sha="${WORKFLOW_RUN_HEAD_SHA}"
          else
            build_sha="${GITHUB_SHA}"
          fi

          if ! git cat-file -e "${build_sha}^{commit}" 2>/dev/null; then
            echo "::error::Build commit ${build_sha} is not reachable from the fetched history."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${RELEASE_TAG_INPUT}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            release_tag="$(python3 ci/scripts/kani_version.py next-tag)"
            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
              echo "::error::Computed auto-release tag ${release_tag} already exists."
              exit 1
            fi
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          python3 ci/scripts/kani_version.py metadata \
            --tag "${release_tag}" \
            --build-sha "${build_sha}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate and assemble release
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # workflow_run is privileged. Start from the repository's trusted
          # default ref instead of feeding event data into checkout.
          fetch-depth: 0

      - name: Select trusted release commit
        env:
          BUILD_SHA: ${{ needs.metadata.outputs.build_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${BUILD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release build SHA is not a canonical commit id."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "${BUILD_SHA}" refs/remotes/origin/main; then
              echo "::error::Android CI build ${BUILD_SHA} is not on trusted main history."
              exit 1
            fi
          fi

          git checkout --detach "${BUILD_SHA}"
          test "$(git rev-parse HEAD)" = "${BUILD_SHA}"

      # This job runs ./gradlew with signing secrets in the environment, so
      # validate the wrapper jar before executing it (PR-only validation in
      # android-ci.yml does not cover direct pushes to main).
      - name: Validate Gradle wrapper
        uses: "gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e"

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Android SDK packages
        uses: ./.github/actions/setup-android-sdk

      # The workflow_run path only fires after Android CI succeeded on this
      # exact commit, so the deterministic test surface is already green and
      # re-running it here would just slow the release down. Manual tag pushes
      # and workflow_dispatch can target commits no CI run has vouched for, so
      # they run the deterministic unit-test surface inline first.
      - name: Run deterministic tests (manual releases only)
        if: github.event_name != 'workflow_run'
        run: |
          ./gradlew \
            :fsrs-java:test \
            :core:test \
            :domain:test \
            :sync-domain:test \
            :writing-core:test \
            :dictionary-core:test \
            :update-core:test \
            :app:testDebugUnitTest \
            --parallel -Dorg.gradle.parallel=true

      # Keep signing material off disk until untrusted project tests have
      # completed on manual release paths.
      - name: Decode signing keystore
        id: signing
        env:
          KANJI_ANKI_SIGNING_KEYSTORE_BASE64: ${{ secrets.KANJI_ANKI_SIGNING_KEYSTORE_BASE64 }}
        run: |
          : "${KANJI_ANKI_SIGNING_KEYSTORE_BASE64:?Missing KANJI_ANKI_SIGNING_KEYSTORE_BASE64 secret}"
          keystore_path="${RUNNER_TEMP}/kani-release.jks"
          printf '%s' "${KANJI_ANKI_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "keystore_path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Build signed release APK
        env:
          KANI_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          KANI_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
          KANI_SIGNING_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          KANI_SIGNING_STORE_PASSWORD: ${{ secrets.KANJI_ANKI_SIGNING_STORE_PASSWORD }}
          KANI_SIGNING_KEY_ALIAS: ${{ secrets.KANJI_ANKI_SIGNING_KEY_ALIAS }}
          KANI_SIGNING_KEY_PASSWORD: ${{ secrets.KANJI_ANKI_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --parallel -Dorg.gradle.parallel=true

      - name: Verify release APK metadata and signature
        run: |
          set -euo pipefail
          source_apk='app/build/outputs/apk/release/app-release.apk'
          if [[ ! -f "${source_apk}" ]]; then
            echo "::error::Expected release APK at ${source_apk}"
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "${source_apk}"
          badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${source_apk}")"
          grep -F "package: name='dev.bee.kanjianki'" <<< "${badging}"
          grep -F "versionCode='${{ needs.metadata.outputs.version_code }}'" <<< "${badging}"
          grep -F "versionName='${{ needs.metadata.outputs.version_name }}'" <<< "${badging}"

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          source_apk='app/build/outputs/apk/release/app-release.apk'
          apk_name='${{ needs.metadata.outputs.apk_name }}'
          checksum_name='${{ needs.metadata.outputs.checksum_name }}'
          apk_path="${RUNNER_TEMP}/${apk_name}"
          sha_path="${RUNNER_TEMP}/${checksum_name}"
          cp "${source_apk}" "${apk_path}"
          (cd "${RUNNER_TEMP}" && sha256sum "${apk_name}") > "${sha_path}"

          {
            echo "apk_path=${apk_path}"
            echo "sha_path=${sha_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kani-android-release-${{ needs.metadata.outputs.version_name }}
          path: |
            ${{ steps.assets.outputs.apk_path }}
            ${{ steps.assets.outputs.sha_path }}

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    needs:
      - metadata
      - validate

    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: kani-android-release-${{ needs.metadata.outputs.version_name }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.metadata.outputs.build_sha }}
          ALLOW_ASSET_OVERWRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_asset_overwrite || false }}
        run: |
          set -euo pipefail
          release_tag='${{ needs.metadata.outputs.release_tag }}'
          apk_path="${RUNNER_TEMP}/release-assets/${{ needs.metadata.outputs.apk_name }}"
          sha_path="${RUNNER_TEMP}/release-assets/${{ needs.metadata.outputs.checksum_name }}"

          if [[ ! -f "${apk_path}" || ! -f "${sha_path}" ]]; then
            echo '::error::Downloaded release assets are missing.'
            exit 1
          fi

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            upload_args=("${release_tag}" "${apk_path}" "${sha_path}" --repo "${GITHUB_REPOSITORY}")
            if [[ "${ALLOW_ASSET_OVERWRITE}" == "true" ]]; then
              upload_args+=(--clobber)
            fi
            gh release upload "${upload_args[@]}"
          else
            gh release create "${release_tag}" "${apk_path}" "${sha_path}" \
              --title "${release_tag}" \
              --target "${BUILD_SHA}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"
          fi
