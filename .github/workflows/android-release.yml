name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.3.0"
        required: true
        type: string

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
      checksum_name: ${{ steps.meta.outputs.checksum_name }}

    steps:
      - name: Compute release metadata
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${RELEASE_TAG_INPUT}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${release_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_name="${major}.${minor}.${patch}"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          apk_name="kani-android-${version_name}.apk"
          checksum_name="${apk_name}.sha256"

          {
            echo "release_tag=${release_tag}"
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "apk_name=${apk_name}"
            echo "checksum_name=${checksum_name}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Validate and build release
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          gradle-version: "9.4.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore
        id: signing
        env:
          KANJI_ANKI_SIGNING_KEYSTORE_BASE64: ${{ secrets.KANJI_ANKI_SIGNING_KEYSTORE_BASE64 }}
        run: |
          : "${KANJI_ANKI_SIGNING_KEYSTORE_BASE64:?Missing KANJI_ANKI_SIGNING_KEYSTORE_BASE64 secret}"
          keystore_path="${RUNNER_TEMP}/kani-release.jks"
          printf '%s' "${KANJI_ANKI_SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "keystore_path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Test, coverage, lint, and release build
        env:
          KANI_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          KANI_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
          KANI_SIGNING_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          KANI_SIGNING_STORE_PASSWORD: ${{ secrets.KANJI_ANKI_SIGNING_STORE_PASSWORD }}
          KANI_SIGNING_KEY_ALIAS: ${{ secrets.KANJI_ANKI_SIGNING_KEY_ALIAS }}
          KANI_SIGNING_KEY_PASSWORD: ${{ secrets.KANJI_ANKI_SIGNING_KEY_PASSWORD }}
        run: |
          gradle --parallel -Dorg.gradle.parallel=true \
            :core:test \
            :core:jacocoTestReport \
            :core:jacocoTestCoverageVerification \
            :app:testDebugUnitTest \
            :app:jacocoDebugUnitTestReport \
            :app:compileDebugAndroidTestJavaWithJavac \
            :app:lintDebug \
            :app:assembleRelease
          python3 -m unittest tools/test_generate_dictionary_assets.py

      - name: Prepare release assets
        id: assets
        run: |
          source_apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "${source_apk}" ]]; then
            echo "::error::Expected release APK at ${source_apk}"
            exit 1
          fi

          apk_name="${{ needs.metadata.outputs.apk_name }}"
          checksum_name="${{ needs.metadata.outputs.checksum_name }}"
          apk_path="${RUNNER_TEMP}/${apk_name}"
          sha_path="${RUNNER_TEMP}/${checksum_name}"
          cp "${source_apk}" "${apk_path}"
          (cd "${RUNNER_TEMP}" && sha256sum "${apk_name}") > "${sha_path}"

          {
            echo "apk_path=${apk_path}"
            echo "sha_path=${sha_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kani-android-release-${{ needs.metadata.outputs.version_name }}
          path: |
            ${{ steps.assets.outputs.apk_path }}
            ${{ steps.assets.outputs.sha_path }}

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - metadata
      - build

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: kani-android-release-${{ needs.metadata.outputs.version_name }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ needs.metadata.outputs.release_tag }}"
          apk_path="${RUNNER_TEMP}/release-assets/${{ needs.metadata.outputs.apk_name }}"
          sha_path="${RUNNER_TEMP}/release-assets/${{ needs.metadata.outputs.checksum_name }}"

          if [[ ! -f "${apk_path}" || ! -f "${sha_path}" ]]; then
            echo "::error::Downloaded release assets are missing."
            exit 1
          fi

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${apk_path}" "${sha_path}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${release_tag}" "${apk_path}" "${sha_path}" \
              --title "${release_tag}" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --repo "${GITHUB_REPOSITORY}"
          fi
