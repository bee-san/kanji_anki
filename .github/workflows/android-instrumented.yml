name: Android Instrumented

# Live AnkiDroid provider coverage runs nightly and on demand. It is
# deliberately NOT part of the release path: the emulator + provider readiness
# dance is inherently flaky and was the top cause of blocked releases. The
# stricter local real-collection gate (AGENTS.md) covers provider/sync
# release-risk changes.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ankidroid-fixture:
    name: AnkiDroid provider fixture API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v4

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Android SDK packages
        uses: ./.github/actions/setup-android-sdk

      - name: Build debug and androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --parallel -Dorg.gradle.parallel=true

      - name: Cache pinned AnkiDroid APK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/ankidroid
          key: ankidroid-2.24.0-x86_64-sha256-v1

      - name: Download pinned AnkiDroid APK
        id: ankidroid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ankidroid"
          apk_name='variant-abi-AnkiDroid-2.24.0-x86_64.apk'
          apk_path="${RUNNER_TEMP}/ankidroid/${apk_name}"
          checksum_file='ci/fixtures/ankidroid/ankidroid-2.24.0.sha256'
          expected_sha256="$(awk -v name="${apk_name}" '$2 == name { print $1 }' "${checksum_file}")"
          if [[ ! "${expected_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Missing pinned SHA-256 for ${apk_name}."
            exit 1
          fi
          if [ -f "${apk_path}" ] && ! printf '%s  %s\n' "${expected_sha256}" "${apk_path}" | sha256sum --check --status; then
            rm -f "${apk_path}"
          fi
          if [ ! -s "${apk_path}" ]; then
            gh release download v2.24.0 \
              --repo ankidroid/Anki-Android \
              --pattern "${apk_name}" \
              --dir "${RUNNER_TEMP}/ankidroid"
          fi
          printf '%s  %s\n' "${expected_sha256}" "${apk_path}" | sha256sum --check
          echo "apk_path=${apk_path}" >> "${GITHUB_OUTPUT}"

      - name: Generate sanitized Kiku collection fixture
        id: fixture
        run: |
          set -euo pipefail
          collection_path="${RUNNER_TEMP}/kiku-provider-fixture.anki2"
          lifecycle_fixture_dir="${RUNNER_TEMP}/retired-lifecycle"
          python3 ci/scripts/create_ankidroid_kiku_fixture.py "${collection_path}"
          python3 ci/scripts/create_ankidroid_retired_lifecycle_fixtures.py "${lifecycle_fixture_dir}"
          echo "collection_path=${collection_path}" >> "${GITHUB_OUTPUT}"
          echo "lifecycle_fixture_dir=${lifecycle_fixture_dir}" >> "${GITHUB_OUTPUT}"

      - name: Enable KVM access
        run: |
          if [ ! -e /dev/kvm ]; then
            echo '::error::/dev/kvm is unavailable'
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run live-provider fixture instrumentation
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7
        env:
          ANKIDROID_APK_PATH: ${{ steps.ankidroid.outputs.apk_path }}
          FIXTURE_COLLECTION_PATH: ${{ steps.fixture.outputs.collection_path }}
          RETIRED_LIFECYCLE_FIXTURE_DIR: ${{ steps.fixture.outputs.lifecycle_fixture_dir }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Cold-boot the emulator every run (-no-snapshot) instead of loading a cached
          # AVD RAM snapshot. The previous two-step snapshot-cache pattern used a static
          # cache key, so when GitHub's hosted runners bumped the emulator build the
          # saved snapshot became unloadable ("Failed to load snapshot 'default_boot' /
          # error while loading state ... device 'ram'"), the emulator never booted, and
          # adb never connected - blocking releases. Cold boot is version-independent and
          # only costs a couple of extra minutes.
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Pass step outputs via env (not inline expression) for shell-injection
          # hygiene, matching the screenshot workflows.
          script: bash ci/scripts/run_ankidroid_fixture.sh "$ANKIDROID_APK_PATH" "$FIXTURE_COLLECTION_PATH" && bash ci/scripts/run_ankidroid_retired_lifecycle_fixture.sh "$RETIRED_LIFECYCLE_FIXTURE_DIR"

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ankidroid-fixture-diagnostics-api-${{ matrix.api-level }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ankidroid-fixture-logcat.txt
            ${{ runner.temp }}/ankidroid-fixture-provider-probe.txt
            ${{ runner.temp }}/ankidroid-fixture-instrumentation.txt
            ${{ runner.temp }}/ankidroid-retired-lifecycle-*.txt
            app/build/reports/**
            app/build/outputs/androidTest-results/**
