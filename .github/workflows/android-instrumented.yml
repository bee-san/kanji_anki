name: Android Instrumented

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA or ref to check out. Defaults to the caller event SHA.'
        required: false
        type: string
        default: ''
    secrets:
      GRADLE_ENCRYPTION_KEY:
        description: 'Gradle configuration-cache encryption key.'
        required: false
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: android-instrumented-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  ankidroid-fixture:
    name: AnkiDroid provider fixture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug and androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --parallel -Dorg.gradle.parallel=true

      - name: Download pinned AnkiDroid APK
        id: ankidroid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ankidroid"
          if ! gh release download v2.24.0 --repo ankidroid/Anki-Android --pattern '*x86_64*.apk' --dir "${RUNNER_TEMP}/ankidroid"; then
            gh release download v2.24.0 --repo ankidroid/Anki-Android --pattern '*.apk' --dir "${RUNNER_TEMP}/ankidroid"
          fi
          apk_path="$(find "${RUNNER_TEMP}/ankidroid" -name '*x86_64*.apk' | sort | head -n 1)"
          if [ -z "${apk_path}" ]; then
            apk_path="$(find "${RUNNER_TEMP}/ankidroid" -name '*universal*.apk' | sort | head -n 1)"
          fi
          if [ -z "${apk_path}" ]; then
            apk_path="$(find "${RUNNER_TEMP}/ankidroid" -name '*.apk' | sort | head -n 1)"
          fi
          if [ -z "${apk_path}" ]; then
            echo '::error::No AnkiDroid APK was downloaded.'
            exit 1
          fi
          echo "apk_path=${apk_path}" >> "${GITHUB_OUTPUT}"

      - name: Generate sanitized Kiku collection fixture
        id: fixture
        run: |
          set -euo pipefail
          collection_path="${RUNNER_TEMP}/kiku-provider-fixture.anki2"
          python3 ci/scripts/create_ankidroid_kiku_fixture.py "${collection_path}"
          echo "collection_path=${collection_path}" >> "${GITHUB_OUTPUT}"

      - name: Enable KVM access
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore AVD snapshot cache
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-35-aosp-atd-x86_64-pixel2-v1

      - name: Generate AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run live-provider fixture instrumentation
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7
        env:
          ANKIDROID_APK_PATH: ${{ steps.ankidroid.outputs.apk_path }}
          FIXTURE_COLLECTION_PATH: ${{ steps.fixture.outputs.collection_path }}
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Pass step outputs via env (not inline expression) for shell-injection
          # hygiene, matching the screenshot workflows.
          script: bash ci/scripts/run_ankidroid_fixture.sh "$ANKIDROID_APK_PATH" "$FIXTURE_COLLECTION_PATH"

      - name: Upload instrumentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ankidroid-fixture-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ankidroid-fixture-logcat.txt
            ${{ runner.temp }}/ankidroid-fixture-provider-probe.txt
            ${{ runner.temp }}/ankidroid-fixture-instrumentation.txt
            app/build/reports/**
            app/build/outputs/androidTest-results/**
