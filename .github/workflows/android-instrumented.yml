name: Android Instrumented

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'fsrs-java/**'
      - 'ci/fixtures/ankidroid/**'
      - 'ci/scripts/create_ankidroid_kiku_fixture.py'
      - '.github/workflows/android-instrumented.yml'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ankidroid-fixture:
    name: AnkiDroid provider fixture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Download pinned AnkiDroid APK
        id: ankidroid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ankidroid"
          if ! gh release download v2.24.0 --repo ankidroid/Anki-Android --pattern '*x86_64*.apk' --dir "${RUNNER_TEMP}/ankidroid"; then
            gh release download v2.24.0 --repo ankidroid/Anki-Android --pattern '*.apk' --dir "${RUNNER_TEMP}/ankidroid"
          fi
          apk_path="$(find "${RUNNER_TEMP}/ankidroid" -name '*x86_64*.apk' | sort | head -n 1)"
          if [ -z "${apk_path}" ]; then
            apk_path="$(find "${RUNNER_TEMP}/ankidroid" -name '*universal*.apk' | sort | head -n 1)"
          fi
          if [ -z "${apk_path}" ]; then
            apk_path="$(find "${RUNNER_TEMP}/ankidroid" -name '*.apk' | sort | head -n 1)"
          fi
          if [ -z "${apk_path}" ]; then
            echo '::error::No AnkiDroid APK was downloaded.'
            exit 1
          fi
          echo "apk_path=${apk_path}" >> "${GITHUB_OUTPUT}"

      - name: Generate sanitized Kiku collection fixture
        id: fixture
        run: |
          set -euo pipefail
          collection_path="${RUNNER_TEMP}/kiku-provider-fixture.anki2"
          python3 ci/scripts/create_ankidroid_kiku_fixture.py "${collection_path}"
          echo "collection_path=${collection_path}" >> "${GITHUB_OUTPUT}"

      - name: Run live-provider fixture instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/scripts/run_ankidroid_fixture.sh '${{ steps.ankidroid.outputs.apk_path }}' '${{ steps.fixture.outputs.collection_path }}'

      - name: Upload instrumentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ankidroid-fixture-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ankidroid-fixture-logcat.txt
            app/build/reports/**
            app/build/outputs/androidTest-results/**
