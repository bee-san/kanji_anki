name: Tryout Builds

# Installable artifacts for hands-on testing, built on demand only.
#
# Separate from every other workflow on purpose. `Android CI` and `Desktop CI` are
# confidence gates — they answer "is this correct" and upload only diagnostics on
# failure. This one answers "let me actually run it", which is a different job with
# different outputs, and folding it into a gate would make every PR push build and
# store four installers nobody asked for.
#
# Explicitly NOT a release. These are unsigned debug/development builds for trying
# the app; publication is Goal 206 and needs signing secrets and authorization that
# this workflow deliberately does not touch.
on:
  workflow_dispatch:
    inputs:
      android:
        description: Build the Android debug APK
        type: boolean
        default: true
      desktop:
        description: Build the desktop packages (DEB, MSI, DMG)
        type: boolean
        default: true

concurrency:
  group: tryout-builds-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  android:
    name: Android debug APK
    if: inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v4

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Android SDK packages
        uses: ./.github/actions/setup-android-sdk

      # Debug, not release: a release build needs the signing keystore, and an
      # unsigned release APK will not install on a device at all. The debug APK is
      # signed with the standard debug key, so it installs and runs.
      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --parallel

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kani-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          # Fail rather than warn: an empty artifact that looks like a successful
          # build is worse than a red job, because it is discovered at install time.
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.host_id }}
    if: inputs.desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # Independent hosts: a Windows failure must not deny you the DMG.
      fail-fast: false
      matrix:
        include:
          - host_id: linux
            runner: ubuntu-24.04
            gradle_command: xvfb-run -a ./gradlew
            artifact_glob: desktop-app/build/compose/binaries/main/deb/*.deb
          - host_id: windows
            runner: windows-2025
            gradle_command: ./gradlew.bat
            artifact_glob: desktop-app/build/compose/binaries/main/msi/*.msi
          - host_id: macos
            runner: macos-15
            gradle_command: ./gradlew
            artifact_glob: desktop-app/build/compose/binaries/main/dmg/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v4

      # The catalog-pinned packaging JDK, matching Desktop CI. This runtime is
      # shipped inside the package, so `java-version: '17'` would let a runner image
      # bump change the JVM a user actually runs.
      - name: Set up the pinned packaging Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17.0.19+10'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Android SDK packages
        uses: ./.github/actions/setup-android-sdk

      # The stable wrapper task, not `packageDeb`/`packageMsi`/`packageDmg`: the
      # plugin's own task names are reached through exactly one place in the build so
      # a rename breaks there once, loudly. It builds only this host's format.
      - name: Build this host's native package
        run: ${{ matrix.gradle_command }} packageDesktopCurrentOs

      # Smoke the image before handing it over. Building a package that cannot start
      # and shipping it to someone to try is worse than failing here.
      - name: Smoke the installed image
        run: ${{ matrix.gradle_command }} smokeDesktopInstalledImage

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kani-desktop-${{ matrix.host_id }}
          path: ${{ matrix.artifact_glob }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload the SBOM and third-party notices
        if: matrix.host_id == 'linux'
        run: ${{ matrix.gradle_command }} generateDesktopSbom

      - name: Attach the SBOM
        if: matrix.host_id == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kani-desktop-sbom
          path: |
            build/sbom/kani-desktop-sbom.json
            build/sbom/kani-desktop-third-party-notices.txt
          retention-days: 14
          if-no-files-found: error
