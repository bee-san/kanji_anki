name: SonarQube
concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      full_coverage:
        description: "Run connected coverage (emulator + androidTest coverage)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          gradle-version: "9.4.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze (PR-safe fast path)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.full_coverage != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          gradle
          :core:test
          :core:jacocoTestReport
          :app:testDebugUnitTest
          :app:jacocoDebugUnitTestReport
          :app:lintDebug
          --parallel
          sonar
          --no-daemon
          --info

      - name: Start Android emulator (manual full coverage mode only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_coverage == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "emulator" "system-images;android-30;google_apis;x86_64"
          sudo sh -c 'echo KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "no" | avdmanager create avd --force --name sonar-api30 --package "system-images;android-30;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd sonar-api30 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim &
          adb wait-for-device
          boot_completed=""
          for attempt in $(seq 1 90); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 4
          done
          if [ "$boot_completed" != "1" ]; then
            echo "Emulator failed to report sys.boot_completed in time."
            adb shell ps | head
            exit 1
          fi
          adb shell input keyevent 82

      - name: Build and analyze (manual full-coverage mode)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_coverage == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          gradle
          :core:test
          :core:jacocoTestReport
          :app:testDebugUnitTest
          :app:jacocoDebugUnitTestReport
          :app:compileDebugAndroidTestJavaWithJavac
          :app:createDebugCoverageReport
          :app:lintDebug
          --parallel
          sonar
          --no-daemon
          --info
