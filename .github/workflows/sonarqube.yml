name: SonarQube

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'bee-fsrs/**'
      - 'domain/**'
      - 'sync-domain/**'
      - 'writing-core/**'
      - 'dictionary-core/**'
      - 'update-core/**'
      - 'desktop-app/**'
      - 'build-logic/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      full_coverage:
        description: "Run connected coverage (emulator + androidTest coverage)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'bee-fsrs/**'
      - 'domain/**'
      - 'sync-domain/**'
      - 'writing-core/**'
      - 'dictionary-core/**'
      - 'update-core/**'
      - 'desktop-app/**'
      - 'build-logic/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Build coverage and analyze
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v4

      - name: Select coverage mode
        id: coverage-mode
        run: |
          set -euo pipefail
          FULL_COVERAGE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.full_coverage }}" = "true" ]; then
            FULL_COVERAGE=true
          fi
          echo "full=$FULL_COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Compute Sonar project version
        id: sonar-version
        run: |
          set -euo pipefail
          release_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [ -n "${release_tag}" ]; then
            version="${release_tag#v}"
          else
            version="${GITHUB_SHA}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          # SonarCloud dropped Java 17 support for the scanner runtime; it now requires
          # Java 21+. The Gradle build still targets Java 17 bytecode (source/target
          # compatibility) but runs fine on a JDK 21 toolchain.
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Android SDK packages
        uses: ./.github/actions/setup-android-sdk

      - name: Enable KVM access (full-coverage mode only)
        if: steps.coverage-mode.outputs.full == 'true'
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache SonarQube packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Robolectric android-all jars
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build and analyze (PR-safe fast path)
        if: steps.coverage-mode.outputs.full != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SONAR_PROJECT_VERSION: ${{ steps.sonar-version.outputs.version }}
        run: |
          bash .github/scripts/run-sonar-analysis.sh fast

      - name: Build and analyze (full connected coverage)
        if: steps.coverage-mode.outputs.full == 'true'
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SONAR_PROJECT_VERSION: ${{ steps.sonar-version.outputs.version }}
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/sonar-full-coverage.sh
