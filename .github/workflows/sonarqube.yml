name: SonarQube

on:
  workflow_dispatch:
    inputs:
      full_coverage:
        description: "Run connected coverage (emulator + androidTest coverage)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'fsrs-java/**'
      - 'domain/**'
      - 'sync-domain/**'
      - 'writing-core/**'
      - 'dictionary-core/**'
      - 'update-core/**'
      - 'tools/**'
      - '.github/workflows/sonarqube.yml'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradlew*'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Build coverage and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed project areas
        id: changed-areas
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="${{ github.sha }}"
          fi

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.sha }}"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="${{ github.sha }}"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")"
          APP_CHANGED=false
          CORE_CHANGED=false
          FSRS_CHANGED=false
          PURE_MODULES_CHANGED=false
          GRADLE_CHANGED=false

          if [ -z "$CHANGED_FILES" ]; then
            GRADLE_CHANGED=false
          else
            while IFS= read -r FILE; do
              case "$FILE" in
                app/*)
                  APP_CHANGED=true
                  ;;
                core/*)
                  CORE_CHANGED=true
                  ;;
                fsrs-java/*)
                  FSRS_CHANGED=true
                  ;;
                domain/*|sync-domain/*|writing-core/*|dictionary-core/*|update-core/*)
                  PURE_MODULES_CHANGED=true
                  ;;
                build.gradle*|settings.gradle*|gradle/*|gradle.properties|gradle/libs.versions.toml|tools/*|.github/workflows/sonarqube.yml)
                  GRADLE_CHANGED=true
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          echo "app=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "core=$CORE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "fsrs=$FSRS_CHANGED" >> "$GITHUB_OUTPUT"
          echo "pure_modules=$PURE_MODULES_CHANGED" >> "$GITHUB_OUTPUT"
          echo "gradle=$GRADLE_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Select coverage mode
        id: coverage-mode
        run: |
          set -euo pipefail
          FULL_COVERAGE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.full_coverage }}" = "true" ]; then
            FULL_COVERAGE=true
          fi
          echo "full=$FULL_COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Compute Sonar project version
        id: sonar-version
        run: |
          set -euo pipefail
          release_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          if [ -n "${release_tag}" ]; then
            version="${release_tag#v}"
          else
            version="${GITHUB_SHA}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          gradle-version: "9.4.1"

      - name: Set up Android SDK
        if: github.event_name == 'workflow_dispatch' || steps.changed-areas.outputs.app == 'true' || steps.changed-areas.outputs.core == 'true' || steps.changed-areas.outputs.fsrs == 'true' || steps.changed-areas.outputs.pure_modules == 'true' || steps.changed-areas.outputs.gradle == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        if: github.event_name == 'workflow_dispatch' || steps.changed-areas.outputs.app == 'true' || steps.changed-areas.outputs.core == 'true' || steps.changed-areas.outputs.fsrs == 'true' || steps.changed-areas.outputs.pure_modules == 'true' || steps.changed-areas.outputs.gradle == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Enable KVM access (full-coverage mode only)
        if: steps.coverage-mode.outputs.full == 'true'
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze (PR-safe fast path)
        if: steps.coverage-mode.outputs.full != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          TASKS=()
          if [ "${{ steps.changed-areas.outputs.fsrs }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS+=( :fsrs-java:test :fsrs-java:jacocoTestReport )
          fi
          if [ "${{ steps.changed-areas.outputs.pure_modules }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS+=(
              :domain:test :domain:jacocoTestReport
              :sync-domain:test :sync-domain:jacocoTestReport
              :writing-core:test :writing-core:jacocoTestReport
              :dictionary-core:test :dictionary-core:jacocoTestReport
              :update-core:test :update-core:jacocoTestReport
            )
          fi
          if [ "${{ steps.changed-areas.outputs.core }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS+=( :core:test :core:jacocoTestReport )
          fi
          if [ "${{ steps.changed-areas.outputs.app }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS+=( :app:testDebugUnitTest :app:jacocoDebugUnitTestReport :app:compileDebugAndroidTestJavaWithJavac )
          fi
          if [ ${#TASKS[@]} -eq 0 ]; then
            TASKS+=( :core:test :core:jacocoTestReport :app:testDebugUnitTest :app:jacocoDebugUnitTestReport )
          fi
          ./gradlew \
            :core:jar \
            :domain:jar \
            :sync-domain:jar \
            :writing-core:jar \
            :dictionary-core:jar \
            :update-core:jar \
            :app:compileDebugJavaWithJavac \
            "${TASKS[@]}" \
            --parallel \
            -Dorg.gradle.parallel=true \
            -PsonarFullCoverage=false \
            -PsonarProjectVersion=${{ steps.sonar-version.outputs.version }}
          ./gradlew sonar --parallel -Dorg.gradle.parallel=true -PsonarFullCoverage=false -PsonarProjectVersion=${{ steps.sonar-version.outputs.version }}

      - name: Build and analyze (full connected coverage)
        if: steps.coverage-mode.outputs.full == 'true'
        uses: reactivecircus/android-emulator-runner@70f4dee990796918b78d040e3278474bdbd348a7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            ./gradlew \
              :core:test \
              :core:jacocoTestReport \
              :fsrs-java:test \
              :fsrs-java:jacocoTestReport \
              :domain:test \
              :domain:jacocoTestReport \
              :sync-domain:test \
              :sync-domain:jacocoTestReport \
              :writing-core:test \
              :writing-core:jacocoTestReport \
              :dictionary-core:test \
              :dictionary-core:jacocoTestReport \
              :update-core:test \
              :update-core:jacocoTestReport \
              :app:testDebugUnitTest \
              :app:jacocoDebugUnitTestReport \
              :app:lintDebug \
              :app:compileDebugAndroidTestJavaWithJavac \
              :app:createDebugCoverageReport \
              --parallel \
              -Dorg.gradle.parallel=true \
              -PsonarFullCoverage=true \
              -PsonarProjectVersion=${{ steps.sonar-version.outputs.version }}
            test -f app/build/reports/coverage/androidTest/debug/connected/report.xml
            ./gradlew sonar \
              --parallel \
              -Dorg.gradle.parallel=true \
              -PsonarFullCoverage=true \
              -PsonarProjectVersion=${{ steps.sonar-version.outputs.version }}
