name: SonarQube
concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      full_coverage:
        description: "Run connected coverage (emulator + androidTest coverage)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed project areas
        id: changed-areas
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          filters: |
            app:
              - 'app/**'
            core:
              - 'core/**'
            gradle:
              - 'build.gradle*'
              - 'settings.gradle*'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradle/libs.versions.toml'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          gradle-version: "9.4.1"

      - name: Set up Android SDK
        if: github.event_name == 'workflow_dispatch' || steps.changed-areas.outputs.app == 'true' || steps.changed-areas.outputs.gradle == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze (PR-safe fast path)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.full_coverage != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          TASKS=""
          if [ "${{ steps.changed-areas.outputs.core }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS="$TASKS :core:test :core:jacocoTestReport"
          fi
          if [ "${{ steps.changed-areas.outputs.app }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS="$TASKS :app:testDebugUnitTest :app:jacocoDebugUnitTestReport"
          fi
          if [ -z "$TASKS" ]; then
            TASKS=":core:test :core:jacocoTestReport :app:testDebugUnitTest :app:jacocoDebugUnitTestReport"
          fi
          gradle $TASKS sonar --parallel -Dorg.gradle.parallel=true

      - name: Build and analyze (manual full-coverage mode)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_coverage == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          gradle
          :core:test
          :core:jacocoTestReport
          :app:testDebugUnitTest
          :app:jacocoDebugUnitTestReport
          :app:lintDebug
          :app:compileDebugAndroidTestJavaWithJavac
          :app:createDebugCoverageReport
          sonar
          --parallel
          -Dorg.gradle.parallel=true
