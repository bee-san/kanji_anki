name: SonarQube
concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      full_coverage:
        description: "Run connected coverage (emulator + androidTest coverage)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - 'fsrs-java/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - 'core/**'
      - 'fsrs-java/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/sonarqube.yml'

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed project areas
        id: changed-areas
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="${{ github.sha }}"
          fi

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.sha }}"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="${{ github.sha }}"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")"
          APP_CHANGED=false
          CORE_CHANGED=false
          FSRS_CHANGED=false
          GRADLE_CHANGED=false

          if [ -z "$CHANGED_FILES" ]; then
            GRADLE_CHANGED=false
          else
            while IFS= read -r FILE; do
              case "$FILE" in
                app/*)
                  APP_CHANGED=true
                  ;;
                core/*)
                  CORE_CHANGED=true
                  ;;
                fsrs-java/*)
                  FSRS_CHANGED=true
                  ;;
                build.gradle*|settings.gradle*|gradle/*|gradle.properties|gradle/libs.versions.toml|.github/workflows/sonarqube.yml)
                  GRADLE_CHANGED=true
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          echo "app=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          echo "core=$CORE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "fsrs=$FSRS_CHANGED" >> "$GITHUB_OUTPUT"
          echo "gradle=$GRADLE_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@39fdf500b386709a9a4a769f717dad447ac345b9
        with:
          gradle-version: "9.4.1"

      - name: Set up Android SDK
        if: github.event_name == 'workflow_dispatch' || steps.changed-areas.outputs.app == 'true' || steps.changed-areas.outputs.gradle == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        if: github.event_name == 'workflow_dispatch' || steps.changed-areas.outputs.app == 'true' || steps.changed-areas.outputs.gradle == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install emulator packages (manual full-coverage mode only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_coverage == 'true'
        run: |
          sdkmanager "emulator" "system-images;android-30;google_apis;x86_64"

      - name: Enable KVM access (manual full-coverage mode only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_coverage == 'true'
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android emulator (manual full-coverage mode)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_coverage == 'true'
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd --force --name sonar-api30 --package "system-images;android-30;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" \
            -avd sonar-api30 \
            -no-window \
            -no-audio \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -no-skin \
            -no-anim \
            > /tmp/emulator.log 2>&1 &
          EMULATOR_PID=$!
          if ! timeout 90s adb wait-for-device; then
            echo "adb wait-for-device timed out."
            kill "$EMULATOR_PID" || true
            cat /tmp/emulator.log
            exit 1
          fi
          boot_completed=""
          for attempt in $(seq 1 90); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 4
          done
          if [ "$boot_completed" != "1" ]; then
            echo "Emulator failed to report sys.boot_completed in time."
            kill "$EMULATOR_PID" || true
            cat /tmp/emulator.log
            exit 1
          fi
          adb shell input keyevent 82

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze (PR-safe fast path)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.full_coverage != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          TASKS=()
          if [ "${{ steps.changed-areas.outputs.fsrs }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS+=( :fsrs-java:test :fsrs-java:jacocoTestReport )
          fi
          if [ "${{ steps.changed-areas.outputs.core }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS+=( :core:test :core:jacocoTestReport )
          fi
          if [ "${{ steps.changed-areas.outputs.app }}" = "true" ] || [ "${{ steps.changed-areas.outputs.gradle }}" = "true" ]; then
            TASKS+=( :app:testDebugUnitTest :app:jacocoDebugUnitTestReport )
          fi
          if [ ${#TASKS[@]} -eq 0 ]; then
            TASKS+=( :core:test :core:jacocoTestReport :app:testDebugUnitTest :app:jacocoDebugUnitTestReport )
          fi
          gradle :core:jar "${TASKS[@]}" --parallel -Dorg.gradle.parallel=true -PsonarFullCoverage=false
          gradle sonar --parallel -Dorg.gradle.parallel=true -PsonarFullCoverage=false

      - name: Build and analyze (manual full-coverage mode)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_coverage == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          gradle
          :core:test
          :core:jacocoTestReport
          :fsrs-java:test
          :fsrs-java:jacocoTestReport
          :app:testDebugUnitTest
          :app:jacocoDebugUnitTestReport
          :app:lintDebug
          :app:compileDebugAndroidTestJavaWithJavac
          :app:createDebugCoverageReport
          --parallel
          -Dorg.gradle.parallel=true
          -PsonarFullCoverage=true
          sonar
